<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Necromantical</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: 'IM Fell English', serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; }
  canvas { width: 100%; max-width: 177.78vh; height: auto; display: block; background: #000; }
  #ui { display: flex; gap: 12px; align-items: center; width: min(100%, 177.78vh); padding: 8px 16px; box-sizing: border-box; }
  #ui button { background: #1a0a0e; color: #e8dcd0; border: 1px solid #5a1020; padding: 6px 14px; font: inherit; cursor: pointer; }
  #scrub { flex: 1; accent-color: #c4122f; }
  #time { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="ui">
    <button id="play">Play</button>
    <input id="scrub" type="range" min="0" max="188.7" step="0.01" value="0">
    <span id="time">0:00.00</span>
    <label><input id="lyr" type="checkbox" checked> lyrics</label>
  </div>
  <audio id="audio" src="audio/Necromantical.mp3" preload="auto"></audio>
</div>
<script src="data/timing.js"></script>
<script src="src/core.js"></script>
<script src="src/pixel.js"></script>
<script src="src/assets.js"></script>
<script src="src/draw.js"></script>
<script src="src/anime.js"></script>
<script src="src/sprites.js"></script>
<script src="src/tiles.js"></script>
<script src="src/rig.js"></script>
<script src="src/maps.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
<script src="src/post.js"></script>
<script src="src/scenes1.js"></script>
<script src="src/scenes2.js"></script>
<script src="src/scenes3.js"></script>
<script src="src/scenes4.js"></script>
<script>
  'use strict';
  const params = new URLSearchParams(location.search);
  const RENDER = params.has('render');
  if (RENDER) document.body.classList.add('render');
  NM.SHOW_LYRICS = params.get('lyrics') !== '0';
  const cvs = document.getElementById('c');
  window.NM_READY = (async () => {
    const fams = ['40px "IM Fell English"', 'italic 40px "IM Fell English"', '40px "IM Fell English SC"',
      '40px "UnifrakturMaguntia"', '40px "Cinzel"', '700 40px "Cinzel"', '40px "Cinzel Decorative"', '700 40px "Cinzel Decorative"',
      '16px "DotGothic16"', '16px "Pixelify Sans"', '700 16px "Pixelify Sans"', '16px "VT323"', '8px "Silkscreen"', '700 8px "Silkscreen"'];
    await Promise.all(fams.map((f) => document.fonts.load(f)));
    NM.buildAssets();
    NM.initBuffers(cvs);
    NM.initPost();
    if (NM.prepare) NM.prepare();
    return true;
  })();
  // used by render/render.mjs
  window.renderFrameJPEG = async (t, q) => { await window.NM_READY; NM.renderFrame(t); return cvs.toDataURL('image/jpeg', q); };
  window.renderFramePNG = async (t) => { await window.NM_READY; NM.renderFrame(t); return cvs.toDataURL('image/png'); };

  if (!RENDER) {
    const audio = document.getElementById('audio');
    const scrub = document.getElementById('scrub');
    const play = document.getElementById('play');
    const time = document.getElementById('time');
    const lyr = document.getElementById('lyr');
    const fmt = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, '0')}`;
    let t = Number(params.get('t') || 0);
    const draw = () => { NM.renderFrame(t); scrub.value = t; time.textContent = fmt(t); };
    window.NM_READY.then(() => {
      draw();
      const loop = () => { if (!audio.paused) { t = audio.currentTime; draw(); } requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    });
    play.onclick = () => { if (audio.paused) { audio.currentTime = t; audio.play(); play.textContent = 'Pause'; } else { audio.pause(); play.textContent = 'Play'; } };
    scrub.oninput = () => { t = Number(scrub.value); audio.currentTime = t; draw(); };
    lyr.onchange = () => { NM.SHOW_LYRICS = lyr.checked; draw(); };
  }
</script>
</body>
</html>
